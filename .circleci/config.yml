version: 2.1
orbs:
  docker: circleci/docker@2.8.0

jobs:

  build-base:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - docker/check
      - docker/build:
          image: suculent/platformio-docker-build
          dockerfile: ./Dockerfile.test.amd64
          tag: ci
      - docker/push:
          digest-path: /tmp/digest.txt
          image: suculent/platformio-docker-build
          tag: ci
      - run:
          name: Persist image digest for downstream test jobs
          command: |
            mkdir -p /tmp/workspace
            cp /tmp/digest.txt /tmp/workspace/digest.txt
            echo "Built digest: $(cat /tmp/workspace/digest.txt)"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - digest.txt

  test-esp32:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: /tmp/workspace
      - docker/check
      - run:
          name: Build esp32 (Arduino) in shared image
          command: |
            DIGEST=$(cat /tmp/workspace/digest.txt)
            docker pull "suculent/platformio-docker-build@${DIGEST}"
            docker run --rm "suculent/platformio-docker-build@${DIGEST}" /opt/tests/build-esp32.sh

  test-esp8266:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: /tmp/workspace
      - docker/check
      - run:
          name: Build esp8266 (Arduino) in shared image
          command: |
            DIGEST=$(cat /tmp/workspace/digest.txt)
            docker pull "suculent/platformio-docker-build@${DIGEST}"
            docker run --rm "suculent/platformio-docker-build@${DIGEST}" /opt/tests/build-esp8266.sh

  test-esp32-idf:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: /tmp/workspace
      - docker/check
      - run:
          name: Build esp32-idf (ESP-IDF) in shared image
          command: |
            DIGEST=$(cat /tmp/workspace/digest.txt)
            docker pull "suculent/platformio-docker-build@${DIGEST}"
            docker run --rm "suculent/platformio-docker-build@${DIGEST}" /opt/tests/build-esp32-idf.sh

  deploy-docker-build:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - run:
          name: Plan a deploy
          command: |
            circleci run release plan \
              --environment-name="production" \
              --component-name="platformio" \
              --target-version="$CIRCLE_SHA1"
      - docker/check
      - docker/build:
          image: suculent/platformio-docker-build
          tag: latest
      - docker/push:
          digest-path: /tmp/digest.txt
          image: suculent/platformio-docker-build
          tag: latest
      - run:
          command: |
            echo "Digest is: $(</tmp/digest.txt)"
            docker tag $(</tmp/digest.txt) suculent/platformio-docker-build:latest
      - run:
          name: Mark deploy SUCCESS
          command: circleci run release update --status=SUCCESS
          when: on_success
      - run:
          name: Mark deploy FAILED
          command: circleci run release update --status=FAILED
          when: on_fail

#
# WORKFLOWS
#

workflows:
  version: 2
  build:
    jobs:
      - build-base:
          context:
            - dockerhub
      - test-esp32:
          context:
            - dockerhub
          requires:
            - build-base
      - test-esp8266:
          context:
            - dockerhub
          requires:
            - build-base
      - test-esp32-idf:
          context:
            - dockerhub
          requires:
            - build-base
      - deploy-docker-build:
          context:
            - dockerhub
          requires:
            - test-esp32
            - test-esp8266
            - test-esp32-idf
          filters:
            branches:
              only: master
